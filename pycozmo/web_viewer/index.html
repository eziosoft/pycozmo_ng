<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozmo 3D World Viewer</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- UI overlays -->
  <div id="hud">
    <span id="fps">-- FPS</span>
    <span id="status" class="disconnected">disconnected</span>
    <span id="cube-count">0 cubes</span>
    <span id="path-count"></span>
  </div>

  <!-- Remote-control HUD. Keys light up while held; keys register
       whenever the browser tab itself is focused. (COZMO-25) -->
  <div id="controls-hud">
    <div id="controls-title">Remote control (click here to focus)</div>
    <table id="controls-grid">
      <tr>
        <td><span class="ctl-key" data-key="w">W</span></td>
        <td class="ctl-label">drive fwd</td>
        <td><span class="ctl-key" data-key="r">R</span></td>
        <td class="ctl-label">head up</td>
      </tr>
      <tr>
        <td>
          <span class="ctl-key" data-key="a">A</span>
          <span class="ctl-key" data-key="s">S</span>
          <span class="ctl-key" data-key="d">D</span>
        </td>
        <td class="ctl-label" colspan="3">spin left / reverse / spin right</td>
      </tr>
      <tr>
        <td>
          <span class="ctl-key" data-key="f">F</span>
          <span class="ctl-key" data-key="t">T</span>
          <span class="ctl-key" data-key="g">G</span>
        </td>
        <td class="ctl-label" colspan="3">head down / lift up / lift down</td>
      </tr>
      <tr>
        <td><span class="ctl-key ctl-key-wide" data-key=" ">SPACE</span></td>
        <td class="ctl-label" colspan="3">stop all motors</td>
      </tr>
    </table>
  </div>

  <!-- Split layout: camera | 3D -->
  <div id="layout">
    <div id="camera-panel">
      <div id="camera-label">Cozmo Camera</div>
      <img id="camera-feed" src="/video" alt="Camera feed" />

      <!-- Camera tuning moved to Cozmo's auto-exposure — see COZMO-24 -->
    </div>
    <div id="viewer-panel"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // -----------------------------------------------------------------------
    // Configuration
    // -----------------------------------------------------------------------
    const WS_PORT = 8765;
    const WS_URL = `ws://${location.hostname || 'localhost'}:${WS_PORT}`;
    const CUBE_SIZE = 44;  // mm
    const CUBE_COLORS = [0xff4444, 0x4444ff, 0x44cc44]; // red, blue, green

    // -----------------------------------------------------------------------
    // Renderer
    // -----------------------------------------------------------------------
    const viewerPanel = document.getElementById('viewer-panel');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x1a1a2e);
    viewerPanel.appendChild(renderer.domElement);
    renderer.setSize(viewerPanel.clientWidth, viewerPanel.clientHeight);

    // -----------------------------------------------------------------------
    // Scene + camera
    // -----------------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x1a1a2e, 1500, 4000);

    const camera = new THREE.PerspectiveCamera(
      45, viewerPanel.clientWidth / viewerPanel.clientHeight, 0.1, 5000
    );
    camera.position.set(200, 100, 200);
    camera.lookAt(0, 0, 0);

    // -----------------------------------------------------------------------
    // Controls
    // -----------------------------------------------------------------------
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.12;
    controls.target.set(0, 0, 0);

    // -----------------------------------------------------------------------
    // Click-to-navigate: raycasting on ground plane (COZMO-28)
    // -----------------------------------------------------------------------
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0); // Y=0 plane

    // Target marker (ring on ground)
    const targetMarker = new THREE.Mesh(
      new THREE.RingGeometry(15, 25, 32),
      new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide, transparent: true, opacity: 0.8 })
    );
    targetMarker.rotation.x = -Math.PI / 2;
    targetMarker.position.y = 0.5;
    targetMarker.visible = false;
    scene.add(targetMarker);

    // Line from robot to target
    const navLineGeo = new THREE.BufferGeometry();
    navLineGeo.setAttribute('position', new THREE.Float32BufferAttribute([0,0,0, 0,0,0], 3));
    const navLineMat = new THREE.LineDashedMaterial({ color: 0x00ff88, dashSize: 10, gapSize: 5 });
    const navLine = new THREE.Line(navLineGeo, navLineMat);
    navLine.visible = false;
    scene.add(navLine);

    let navTarget = null; // scene-frame Vector3 of clicked point

    function onViewerClick(event) {
      // Only handle left click, ignore if orbiting (right-click/middle)
      if (event.button !== 0) return;

      const panel = document.getElementById('viewer-panel');
      const rect = panel.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      // First: check if a cube was clicked
      const cubeMeshes = [];
      for (const [id, g] of Object.entries(cubeGroups)) {
        g.traverse(child => {
          if (child.isMesh) cubeMeshes.push(child);
        });
      }
      const cubeHits = raycaster.intersectObjects(cubeMeshes);
      if (cubeHits.length > 0) {
        // Find which cube group was hit
        let hitObj = cubeHits[0].object;
        for (const [id, g] of Object.entries(cubeGroups)) {
          if (g.children.includes(hitObj) || g === hitObj.parent) {
            sendApproachCube(id);
            return;
          }
        }
        // Fallback: walk up to find cube group
        let parent = hitObj.parent;
        while (parent && !Object.values(cubeGroups).includes(parent)) {
          parent = parent.parent;
        }
        if (parent) {
          const cubeId = Object.keys(cubeGroups).find(k => cubeGroups[k] === parent);
          if (cubeId) {
            sendApproachCube(cubeId);
            return;
          }
        }
      }

      // Second: ground plane click — navigate to point
      const hit = new THREE.Vector3();
      const intersected = raycaster.ray.intersectPlane(groundPlane, hit);

      if (intersected) {
        // Clamp to grid bounds (±1000mm)
        hit.x = Math.max(-1000, Math.min(1000, hit.x));
        hit.z = Math.max(-1000, Math.min(1000, hit.z));
        hit.y = 0.5;

        navTarget = hit.clone();
        targetMarker.position.copy(hit);
        targetMarker.visible = true;

        // Draw dashed line from robot to target
        const rp = robot.position;
        const positions = navLine.geometry.attributes.position.array;
        positions[0] = rp.x; positions[1] = 0.5; positions[2] = rp.z;
        positions[3] = hit.x; positions[4] = 0.5; positions[5] = hit.z;
        navLine.geometry.attributes.position.needsUpdate = true;
        navLine.computeLineDistances();
        navLine.visible = true;

        // Send navigate_to (scene coords — server converts to world)
        sendNavigateTo(hit.x, hit.z);
      }
    }

    function sendNavigateTo(sceneX, sceneZ) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      try {
        ws.send(JSON.stringify({ type: 'navigate_to', x: sceneX, z: sceneZ }));
      } catch (e) {
        console.warn('navigate_to send failed', e);
      }
    }

    function sendApproachCube(cubeId) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      try {
        ws.send(JSON.stringify({ type: 'approach_cube', cube_id: cubeId }));
      } catch (e) {
        console.warn('approach_cube send failed', e);
      }
    }

    function sendDock() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      try {
        ws.send(JSON.stringify({ type: 'dock' }));
      } catch (e) {
        console.warn('dock send failed', e);
      }
    }

    // Right-click or Escape cancels navigation
    function cancelNavigation() {
      navTarget = null;
      targetMarker.visible = false;
      navLine.visible = false;
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      try {
        ws.send(JSON.stringify({ type: 'navigate_cancel' }));
      } catch (e) { /* ignore */ }
    }

    viewerPanel.addEventListener('click', onViewerClick);
    viewerPanel.addEventListener('contextmenu', (e) => { e.preventDefault(); cancelNavigation(); });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') cancelNavigation(); });

    // -----------------------------------------------------------------------
    // Lighting
    // -----------------------------------------------------------------------
    const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(0, 300, -200);
    scene.add(dirLight);

    const backLight = new THREE.DirectionalLight(0xffffff, 0.4);
    backLight.position.set(0, 200, 400);
    scene.add(backLight);

    // -----------------------------------------------------------------------
    // Grid  (2000mm, 20 divisions = 100mm spacing)
    // -----------------------------------------------------------------------
    const grid = new THREE.GridHelper(2000, 20, 0x555555, 0x333333);
    grid.material.opacity = 0.4;
    grid.material.transparent = true;
    scene.add(grid);

    // -----------------------------------------------------------------------
    // Axes (RGB = XYZ, 100mm)
    // -----------------------------------------------------------------------
    const axes = new THREE.AxesHelper(100);
    scene.add(axes);

    // -----------------------------------------------------------------------
    // Floor plane
    // -----------------------------------------------------------------------
    const floorGeo = new THREE.PlaneGeometry(4000, 4000);
    const floorMat = new THREE.MeshLambertMaterial({ color: 0x888888, side: THREE.DoubleSide });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.1;
    scene.add(floor);

    // -----------------------------------------------------------------------
    // Robot box  (Cozmo: 90 L x 56 W x 70 H mm — BoxGeometry(x=W, y=H, z=L))
    // Camera: 30 mm back from front, 38 mm high. Rotation point: 50 mm from front.
    // (COZMO-28, user-measured)
    // -----------------------------------------------------------------------
    function createRobot() {
      const group = new THREE.Group();

      // Cozmo dimensions: 90 mm long, 56 mm wide, 70 mm high.
      // Width along scene X, height along scene Y, length along scene Z
      // (forward), so BoxGeometry(width=56, height=70, depth=90).
      const geo = new THREE.BoxGeometry(56, 70, 90);
      // Wireframe
      const wire = new THREE.LineSegments(
        new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({ color: 0xcccccc })
      );
      group.add(wire);
      // Semi-transparent fill
      const fill = new THREE.Mesh(
        geo,
        new THREE.MeshLambertMaterial({
          color: 0x888888,
          transparent: true,
          opacity: 0.25,
        })
      );
      group.add(fill);

      // The group origin is the robot's yaw rotation point (50 mm from front,
      // on the ground). Camera is 30 mm back from front, 38 mm up.
      // Box front is at Z = +40 (50 mm forward of rotation point).
      // Box center: (0, 35, -5) — half-height up, half-length shifted back.
      fill.position.set(0, 35, -5);
      wire.position.set(0, 35, -5);

      // Camera origin marker (yellow dot) — 30 mm back, 38 mm up
      const camGeo = new THREE.SphereGeometry(3, 12, 8);
      const camMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
      const camMarker = new THREE.Mesh(camGeo, camMat);
      camMarker.position.set(0, 38, 20); // 20 = 50-30, forward of rotation point
      group.add(camMarker);

      return group;
    }
    const robot = createRobot();
    robot.userData = {
      heading: 0, targetHeading: 0,
      pos: new THREE.Vector3(0, 40, 0),
      targetPos: new THREE.Vector3(0, 40, 0),
    };
    scene.add(robot);

    // -----------------------------------------------------------------------
    // Path trail. (COZMO-27) Points arrive already in scene coordinates —
    // the library (WorldMap + WebViewerServer) does all frame math.
    // -----------------------------------------------------------------------
    const PATH_MAX_POINTS = 5000;
    const pathPositions = new Float32Array(PATH_MAX_POINTS * 3);
    const pathGeometry = new THREE.BufferGeometry();
    pathGeometry.setAttribute('position', new THREE.BufferAttribute(pathPositions, 3));
    pathGeometry.setDrawRange(0, 0);

    const pathMaterial = new THREE.LineBasicMaterial({ color: 0x00ff88 });
    const pathLine = new THREE.Line(pathGeometry, pathMaterial);
    scene.add(pathLine);
    let pathPointCount = 0;

    // -----------------------------------------------------------------------
    // Cube management
    // -----------------------------------------------------------------------
    const cubeGroups = {};  // cube_id → THREE.Group

    // Cubes arrive in scene coordinates (library does the frame math).
    let hasRobotPose = false;
    let didInitialFrame = false;  // one-shot: re-frame camera on first pose

    function createCube(id) {
      const group = new THREE.Group();

      const idx = parseInt(id.replace('cube_', ''), 10) - 1;
      const color = CUBE_COLORS[idx] || 0x00ccaa;

      // Wireframe edges
      const geo = new THREE.BoxGeometry(CUBE_SIZE, CUBE_SIZE, CUBE_SIZE);
      const wire = new THREE.LineSegments(
        new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({ color: 0xffffff })
      );
      group.add(wire);

      // Semi-transparent colored faces
      const mat = new THREE.MeshLambertMaterial({
        color,
        transparent: true,
        opacity: 0.45,
      });
      const mesh = new THREE.Mesh(geo, mat);
      group.add(mesh);

      // Small axes at cube center
      const axLen = CUBE_SIZE * 0.6;
      const axGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(axLen, 0, 0),
      ]);
      const redLine = new THREE.Line(axGeo, new THREE.LineBasicMaterial({ color: 0xff0000 }));
      group.add(redLine);

      const ayGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, axLen, 0),
      ]);
      const greenLine = new THREE.Line(ayGeo, new THREE.LineBasicMaterial({ color: 0x00ff00 }));
      group.add(greenLine);

      const azGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, axLen),
      ]);
      const blueLine = new THREE.Line(azGeo, new THREE.LineBasicMaterial({ color: 0x0000ff }));
      group.add(blueLine);

      group.userData = { targetPos: new THREE.Vector3(), targetQuat: new THREE.Quaternion() };
      scene.add(group);
      cubeGroups[id] = group;
      return group;
    }

    function removeCube(id) {
      const g = cubeGroups[id];
      if (g) {
        scene.remove(g);
        delete cubeGroups[id];
      }
    }

    // -----------------------------------------------------------------------
    // WebSocket
    // -----------------------------------------------------------------------
    let ws;
    let reconnectTimer;

    function connectWS() {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        setStatus('connected');
      };
      ws.onclose = () => {
        setStatus('disconnected');
        reconnectTimer = setTimeout(connectWS, 2000);
      };
      ws.onerror = () => {
        ws.close();
      };
      ws.onmessage = (evt) => {
        try {
          const state = JSON.parse(evt.data);
          applyState(state);
        } catch (e) {
          console.warn('bad message', e);
        }
      };
    }

    function applyState(state) {
      // Cubes
      const seen = new Set();
      for (const c of state.cubes || []) {
        seen.add(c.id);
        let g = cubeGroups[c.id];
        if (!g) g = createCube(c.id);

        g.userData.targetPos.set(c.position[0], c.position[1], c.position[2]);

        // Rotation matrix → quaternion
        const m = new THREE.Matrix4();
        m.set(
          c.rotation[0][0], c.rotation[0][1], c.rotation[0][2], 0,
          c.rotation[1][0], c.rotation[1][1], c.rotation[1][2], 0,
          c.rotation[2][0], c.rotation[2][1], c.rotation[2][2], 0,
          0, 0, 0, 1
        );
        g.userData.targetQuat.setFromRotationMatrix(m);
      }
      // Remove cubes no longer present
      for (const id of Object.keys(cubeGroups)) {
        if (!seen.has(id)) removeCube(id);
      }
      document.getElementById('cube-count').textContent = `${seen.size} cubes`;

      // Path trail. Points arrive in scene coordinates (library does the math).
      if (state.path_points) {
        const pts = state.path_points;
        pathPointCount = Math.min(pts.length, PATH_MAX_POINTS);
        for (let i = 0; i < pathPointCount; i++) {
          pathPositions[i * 3]     = pts[i][0];
          pathPositions[i * 3 + 1] = pts[i][1];
          pathPositions[i * 3 + 2] = pts[i][2];
        }
        pathGeometry.attributes.position.needsUpdate = true;
        pathGeometry.setDrawRange(0, pathPointCount);
        const pathEl = document.getElementById('path-count');
        if (pathEl) pathEl.textContent = `${pathPointCount} pts`;
      }

      // Robot pose — position and heading arrive already in scene frame
      // (heading is a scene rotation.y). (COZMO-27)
      if (state.robot) {
        robot.userData.targetHeading = state.robot.heading || 0;
        const rp = state.robot.position || [0, 0, 0];
        robot.userData.targetPos.set(rp[0], rp[1], rp[2]);
        if (!hasRobotPose) {
          robot.userData.heading = robot.userData.targetHeading;
          robot.rotation.y = robot.userData.heading;
          robot.position.copy(robot.userData.targetPos);
          robot.userData.pos.copy(robot.userData.targetPos);
          hasRobotPose = true;
        }

        // Hide nav markers when robot is close to target (within 30mm)
        if (navTarget) {
          const dx = rp[0] - navTarget.x;
          const dz = rp[2] - navTarget.z;
          if (Math.sqrt(dx*dx + dz*dz) < 30) {
            navTarget = null;
            targetMarker.visible = false;
            navLine.visible = false;
          }
        }
      }
    }

    // -----------------------------------------------------------------------
    // Remote control — keyboard → Cozmo motors via WebSocket. (COZMO-25)
    //
    // Keys register whenever the page has focus (the natural
    // expectation: tab focus follows the click). The on-screen HUD
    // shows what's held; pressing the keys without ever clicking the
    // HUD will also work as long as the tab itself is the focused
    // browser tab.
    // -----------------------------------------------------------------------
    const CONTROL_KEYS = {
      w: 'drive fwd',
      s: 'drive rev',
      a: 'spin left',
      d: 'spin right',
      r: 'head up',
      f: 'head down',
      t: 'lift up',
      g: 'lift down',
      ' ': 'stop all',
    };
    const heldKeys = new Set();
    const controlKeyEls = document.querySelectorAll('.ctl-key');

    // Send current key state to the server. Called on every key event
    // AND by a periodic heartbeat so the server always has the latest
    // state even if a keyup event is swallowed by the browser.
    function sendControl() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      try {
        ws.send(JSON.stringify({ type: 'control', keys: Array.from(heldKeys) }));
      } catch (e) {
        console.warn('control send failed', e);
      }
    }

    // Heartbeat: re-send held keys every 50 ms. This is the primary
    // mechanism for keeping Cozmo driving — individual keyup events
    // may be unreliable (e.g. browser focus quirks), but the heartbeat
    // guarantees the server always sees the correct key state.
    setInterval(sendControl, 50);

    function describeKeys(keys) {
      const names = [];
      for (const k of keys) {
        if (k === ' ') names.push('SPACE');
        else names.push(k.toUpperCase());
      }
      return names;
    }

    function updateControlHud() {
      for (const el of controlKeyEls) {
        const k = el.dataset.key;
        if (k in CONTROL_KEYS) {
          el.classList.toggle('active', heldKeys.has(k));
        }
      }
      const titleEl = document.getElementById('controls-title');
      if (titleEl) {
        titleEl.textContent =
          heldKeys.size > 0
            ? `Driving: ${describeKeys(heldKeys).join(' + ')}`
            : 'Remote control — keys register while this tab is focused';
      }
    }

    function clearHeld() {
      if (heldKeys.size === 0) return;
      heldKeys.clear();
      sendControl();
      updateControlHud();
    }

    function normalizeKey(e) {
      if (e.key === ' ') return ' ';
      if (e.key.length === 1) return e.key.toLowerCase();
      return e.key;
    }

    function onKeyDown(e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const norm = normalizeKey(e);
      if (e.repeat) return;
      if (norm === 'z') {
        e.preventDefault();
        sendDock();
        return;
      }
      if (!(norm in CONTROL_KEYS)) return;
      e.preventDefault();
      heldKeys.add(norm);
      sendControl();
      updateControlHud();
    }

    function onKeyUp(e) {
      const norm = normalizeKey(e);
      if (!(norm in CONTROL_KEYS)) return;
      heldKeys.delete(norm);
      sendControl();
      updateControlHud();
    }

    window.addEventListener('keydown', onKeyDown, { capture: true });
    window.addEventListener('keyup', onKeyUp, { capture: true });
    window.addEventListener('blur', clearHeld);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) clearHeld();
    });
    window.addEventListener('beforeunload', () => {
      heldKeys.clear();
      sendControl();
    });

    // -----------------------------------------------------------------------
    // HUD helpers
    // -----------------------------------------------------------------------
    function setStatus(s) {
      const el = document.getElementById('status');
      el.textContent = s;
      el.className = s === 'connected' ? 'connected' : 'disconnected';
    }

    // -----------------------------------------------------------------------
    // Render loop
    // -----------------------------------------------------------------------
    let frameCount = 0;
    let lastFpsTime = performance.now();

    const _tmpPos = new THREE.Vector3();
    const _tmpQuat = new THREE.Quaternion();

    // (COZMO-31) One-shot camera framing: place the camera behind the
    // robot along its heading axis so the user sees the scene along
    // Cozmo's actual viewing direction on page load. Subsequent user
    // drags on OrbitControls override this — we don't fight them.
    function frameAlongHeading() {
      const h = robot.userData.heading || 0;
      const sinH = Math.sin(h);
      const cosH = Math.cos(h);
      // Heading rotation around world Z (= scene +Y) takes scene +Z
      // (the robot's drawn forward) to (sin h, 0, cos h).
      const fwd = new THREE.Vector3(sinH, 0, cosH);
      const back = fwd.clone().multiplyScalar(-1);

      const target = robot.position.clone();
      target.y += 0;  // eye line at camera origin

      const dist = 300;
      const height = 120;
      camera.position.copy(robot.position).add(back.multiplyScalar(dist));
      camera.position.y = target.y + height;
      camera.lookAt(target);
      controls.target.copy(target);
      controls.update();
      didInitialFrame = true;
    }

    function animate() {
      requestAnimationFrame(animate);

      // Lerp cubes toward target poses
      for (const g of Object.values(cubeGroups)) {
        const lerp = 0.35;
        _tmpPos.copy(g.userData.targetPos);
        g.position.lerp(_tmpPos, lerp);
        _tmpQuat.copy(g.userData.targetQuat);
        g.quaternion.slerp(_tmpQuat, lerp);
      }

      // Lerp robot heading toward target (unwrap to avoid 359° → 1° flips).
      if (hasRobotPose) {
        const tgt = robot.userData.targetHeading;
        let cur = robot.userData.heading;
        let diff = tgt - cur;
        while (diff > Math.PI) diff -= 2 * Math.PI;
        while (diff < -Math.PI) diff += 2 * Math.PI;
        robot.userData.heading = cur + diff * 0.25;
        robot.rotation.y = robot.userData.heading;

        // Lerp robot position toward target
        _tmpPos.copy(robot.userData.targetPos);
        robot.position.lerp(_tmpPos, 0.25);
        robot.userData.pos.copy(robot.position);
      }

      if (hasRobotPose && !didInitialFrame) {
        frameAlongHeading();
      }

      controls.update();
      renderer.render(scene, camera);

      // FPS counter
      frameCount++;
      const now = performance.now();
      if (now - lastFpsTime >= 1000) {
        document.getElementById('fps').textContent = `${frameCount} FPS`;
        frameCount = 0;
        lastFpsTime = now;
      }
    }

    // -----------------------------------------------------------------------
    // Resize
    // -----------------------------------------------------------------------
    window.addEventListener('resize', () => {
      const panel = document.getElementById('viewer-panel');
      const w = panel.clientWidth;
      const h = panel.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    // -----------------------------------------------------------------------
    // Camera tuning moved to Cozmo's auto-exposure — see COZMO-24
    // -----------------------------------------------------------------------
    function initControls() {
      // No-op: brightness/gamma sliders removed. The browser now shows
      // the raw Cozmo feed; let Cozmo's auto-exposure pick the right
      // gain and shutter speed for the scene.
    }

    // (legacy initControls body — kept referenced above as a no-op)

    // -----------------------------------------------------------------------
    // Start
    // -----------------------------------------------------------------------
    connectWS();
    initControls();
    animate();
  </script>
</body>
</html>
